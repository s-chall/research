<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">From source passage to human interpretation</title><desc id="desc">Proposed information flow / no system is implemented. Source passage then Suggested code then Researcher decision. A proposed review interaction. Coding methods and evaluation must be defined with the lab.</desc><rect x="0" y="0" width="1000" height="450" rx="18" fill="#FFFFFF" stroke="#D5DFE9"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657C92"/></marker></defs><text x="36" y="48" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">From source passage to human interpretation</text><text x="36" y="81" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Proposed information flow / no system is implemented</text><rect x="36" y="137" width="272" height="82" rx="12" fill="#F5EFFB" stroke="none"/><text x="52" y="169" fill="#7044A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Source passage</text><text x="52" y="197" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Original research material</text><path d="M308 178 H364" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><rect x="364" y="137" width="272" height="82" rx="12" fill="#F5EFFB" stroke="none"/><text x="380" y="169" fill="#7044A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Suggested code</text><text x="380" y="197" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Linked to its evidence</text><path d="M636 178 H692" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><rect x="692" y="137" width="272" height="82" rx="12" fill="#F5EFFB" stroke="none"/><text x="708" y="169" fill="#7044A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Researcher decision</text><text x="708" y="197" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Accept, revise, or reject</text><rect x="36" y="260" width="928" height="99" rx="12" fill="#F5EFFB" stroke="none"/><text x="57" y="295" fill="#7044A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">The guiding idea</text><text x="57" y="328" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Make the information easy to inspect, explain, and trace back to its source.</text><text x="36" y="408" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">A proposed review interaction. Coding methods and evaluation must be defined with the lab.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Reading analysis architecture</title><desc id="desc">React review interface to FastAPI to a background alignment worker. The API stores assessment state and corrections; the worker stores versioned predictions. PostgreSQL or SQLite stores assessment data.</desc><rect x="0" y="0" width="1000" height="450" rx="18" fill="#FFFFFF" stroke="#D5DFE9"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657C92"/></marker></defs><text x="36" y="48" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">How reading analysis works</text><text x="36" y="81" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Predictions and researcher corrections stay separate throughout review.</text><rect x="36" y="118" width="272" height="82" rx="12" fill="#EAF8F5" stroke="none"/><text x="52" y="150" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Review interface</text><text x="52" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">React / TypeScript</text><rect x="364" y="118" width="272" height="82" rx="12" fill="#EAF8F5" stroke="none"/><text x="380" y="150" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Assessment API</text><text x="380" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">FastAPI / Python</text><rect x="692" y="118" width="272" height="82" rx="12" fill="#EAF8F5" stroke="none"/><text x="708" y="150" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Background worker</text><text x="708" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Versioned word alignment</text><path d="M308 159 H364" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><path d="M636 159 H692" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><rect x="364" y="270" width="272" height="82" rx="12" fill="#EAF8F5" stroke="none"/><text x="380" y="302" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Assessment database</text><text x="380" y="330" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">PostgreSQL / SQLite fallback</text><path d="M500 200 V270" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><path d="M828 200 V311 H636" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><text x="705" y="296" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Save predictions</text><text x="36" y="284" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Listen to a word.</text><text x="36" y="317" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Inspect its prediction.</text><text x="36" y="347" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Save a correction.</text><text x="36" y="408" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Simplified processing and persistence view; audio storage and playback are omitted.</text></svg>

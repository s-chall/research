<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Question generation architecture</title><desc id="desc">Portal to job API to database and outbox. A publisher delivers events to a queue. Python workers save generated results to the database. Current provider is deterministic and offline.</desc><rect x="0" y="0" width="1000" height="450" rx="18" fill="#FFFFFF" stroke="#D5DFE9"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657C92"/></marker></defs><text x="36" y="48" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">How question generation works</text><text x="36" y="81" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">The interface stays responsive while background workers process the batch.</text><rect x="36" y="118" width="272" height="82" rx="12" fill="#EDF4FF" stroke="none"/><text x="52" y="150" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Researcher portal</text><text x="52" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Submit, monitor, review</text><rect x="364" y="118" width="272" height="82" rx="12" fill="#EDF4FF" stroke="none"/><text x="380" y="150" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Job API</text><text x="380" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">TypeScript / Fastify</text><rect x="692" y="118" width="272" height="82" rx="12" fill="#EDF4FF" stroke="none"/><text x="708" y="150" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Database + outbox</text><text x="708" y="178" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">PostgreSQL</text><path d="M308 159 H364" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><path d="M636 159 H692" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><rect x="692" y="270" width="272" height="82" rx="12" fill="#EDF4FF" stroke="none"/><text x="708" y="302" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Publisher + queue</text><text x="708" y="330" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">SQS-compatible delivery</text><rect x="364" y="270" width="272" height="82" rx="12" fill="#EDF4FF" stroke="none"/><text x="380" y="302" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Generation worker</text><text x="380" y="330" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Python / offline provider</text><path d="M828 200 V270" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><path d="M692 311 H636" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><path d="M500 270 V235 H675 V182 H692" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#a)"/><text x="506" y="229" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Save results</text><text x="36" y="284" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Safe retries.</text><text x="36" y="317" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Recover interrupted work.</text><text x="36" y="347" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Avoid duplicate results.</text><text x="36" y="408" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Implemented component view. Production model integration and live AWS deployment remain open.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Research, made tangible</title><desc id="desc">Sai Challagundla. Software across AI assessment, oral reading, qualitative analysis, and research data. Some projects are proposed.</desc><rect x="0" y="0" width="1000" height="300" rx="20" fill="#102A43" stroke="none"/><text x="44" y="53" fill="#C5D7E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Sai Challagundla / Research &amp; software</text><text x="44" y="113" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Research, made tangible.</text><text x="44" y="154" fill="#D7E4F0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Software for asking better questions, hearing every word,</text><text x="44" y="183" fill="#D7E4F0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">and making sense of human experiences.</text><rect x="44" y="228" width="180" height="38" rx="8" fill="#1A3A55" stroke="none"/><text x="58" y="253" fill="#8DB8FF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">AI assessment</text><rect x="238" y="228" width="170" height="38" rx="8" fill="#1A3A55" stroke="none"/><text x="252" y="253" fill="#69D5CE" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Oral reading</text><rect x="422" y="228" width="196" height="38" rx="8" fill="#1A3A55" stroke="none"/><text x="436" y="253" fill="#C8AEF5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Qualitative analysis</text><rect x="632" y="228" width="176" height="38" rx="8" fill="#1A3A55" stroke="none"/><text x="646" y="253" fill="#F2C476" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Research data</text><path d="M 878 72 L 924 120 L 878 168 L 924 216" fill="none" stroke="#365670" stro
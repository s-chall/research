<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="706" viewBox="0 0 1000 706" role="img" aria-labelledby="title desc"><title id="title">Behind the experience: two application architectures</title><desc id="desc">Choa: React portal to TypeScript API to PostgreSQL and outbox; publisher and queue deliver work to a Python worker that saves results. Literacy: React interface to FastAPI to background sequence alignment; the API and worker persist assessment data. Simplified component view, not a deployment diagram.</desc><rect x="0" y="0" width="1000" height="706" rx="18" fill="#FFFFFF" stroke="#D5DFE9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657C92"/></marker></defs><text x="36" y="48" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Behind the experience</text><text x="36" y="81" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Simplified architecture of the two existing applications</text><text x="36" y="129" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Choa Lab / Question generation</text><rect x="36" y="151" width="260" height="76" rx="10" fill="#EDF4FF" stroke="none"/><text x="52" y="182" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Researcher portal</text><text x="52" y="208" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">React + TypeScript</text><rect x="370" y="151" width="260" height="76" rx="10" fill="#EDF4FF" stroke="none"/><text x="386" y="182" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Job API</text><text x="386" y="208" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">TypeScript</text><rect x="704" y="151" width="260" height="76" rx="10" fill="#EDF4FF" stroke="none"/><text x="720" y="182" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Database + outbox</text><text x="720" y="208" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">PostgreSQL</text><path d="M296 189 L370 189" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 189 L704 189" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="704" y="281" width="260" height="76" rx="10" fill="#EDF4FF" stroke="none"/><text x="720" y="312" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Publisher + queue</text><text x="720" y="338" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">SQS-compatible delivery</text><rect x="370" y="281" width="260" height="76" rx="10" fill="#EDF4FF" stroke="none"/><text x="386" y="312" fill="#2459AF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Generation worker</text><text x="386" y="338" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Python / offline provider</text><path d="M834 227 L834 281" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M704 319 L630 319" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 281 V250 H684 V211 H704" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="247" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Save results</text><text x="36" y="268" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">The API accepts the request.</text><text x="36" y="298" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Workers handle the longer task.</text><text x="36" y="328" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Researchers review the result.</text><text x="36" y="392" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Current provider is deterministic. AWS deployment is not yet verified.</text><path d="M36 416 H964" stroke="#DFE6ED"/><text x="36" y="458" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">First Grade Literacy Lab / Reading analysis</text><rect x="36" y="480" width="260" height="76" rx="10" fill="#EAF8F5" stroke="none"/><text x="52" y="511" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Review interface</text><text x="52" y="537" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">React + TypeScript</text><rect x="370" y="480" width="260" height="76" rx="10" fill="#EAF8F5" stroke="none"/><text x="386" y="511" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Assessment API</text><text x="386" y="537" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">FastAPI / Python</text><rect x="704" y="480" width="260" height="76" rx="10" fill="#EAF8F5" stroke="none"/><text x="720" y="511" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Background worker</text><text x="720" y="537" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Sequence alignment</text><path d="M296 518 L370 518" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 518 L704 518" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="370" y="598" width="260" height="76" rx="10" fill="#EAF8F5" stroke="none"/><text x="386" y="629" fill="#08766E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Assessment database</text><text x="386" y="655" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">PostgreSQL / SQLite fallback</text><path d="M500 556 L500 598" stroke="#657C92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M834 556 V636 H630" fill="none" stroke="#657C92" stroke-width="2" marker-end="url(#arrow)"/><text x="710" y="621" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Save predictions</text><text x="36" y="614" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Review predictions.</text><text x="36" y="643" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Keep corrections separate.</text></svg>

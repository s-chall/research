<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" role="img" aria-labelledby="title desc"><title id="title">Give research data a clearer story.</title><desc id="desc">Prepare data then Check structure; Explore patterns then Visual comparisons; Share findings then Reproducible outputs. Concept preview / scope to be confirmed</desc><rect x="0" y="0" width="1000" height="434" rx="18" fill="#FFFFFF" stroke="#D5DFE9"/><rect x="0" y="0" width="10" height="434" rx="0" fill="#905B12" stroke="none"/><text x="38" y="43" fill="#905B12" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Concept preview / scope to be confirmed</text><text x="38" y="89" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Give research data a clearer story.</text><rect x="38" y="120" width="288" height="100" rx="12" fill="#FFF7E7" stroke="none"/><text x="56" y="157" fill="#905B12" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Prepare data</text><text x="56" y="190" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Check structure</text><path d="M 332 170 H 349 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#905B12" stroke-width="2.5"/><rect x="356" y="120" width="288" height="100" rx="12" fill="#FFF7E7" stroke="none"/><text x="374" y="157" fill="#905B12" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Explore patterns</text><text x="374" y="190" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Visual comparisons</text><path d="M 650 170 H 667 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#905B12" stroke-width="2.5"/><rect x="674" y="120" width="288" height="100" rx="12" fill="#FFF7E7" stroke="none"/><text x="692" y="157" fill="#905B12" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Share findings</text><text x="692" y="190" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Reproducible outputs</text><path d="M38 248 H962" stroke="#DFE6ED"/><text x="38" y="285" fill="#172D46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">A possible direction for future lab software.</text><text x="38" y="321" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">A visual explorer for organizing and understanding study data.</text><text x="38" y="350" fill="#445B70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">The lab workflow and implementation have not been defined.</text><rect x="38" y="386" width="44" height="5" rx="2" fill="#905B12" stroke="none"/><rect x="162" y="386" width="72" height="5" rx="2" fill="#905B12" stroke="none"/><rect x="286" y="386" width="104" height="5" rx="2" fill="#905B12" stroke="none"/></svg>
